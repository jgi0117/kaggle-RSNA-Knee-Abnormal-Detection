[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-guidance-rag"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "torch",
  "transformers",
  "scikit-learn",
  "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]
